services:
  # ── 1. PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to localhost only — prevents LAN/VPN exposure of the dev DB.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Enables the vector extension before any app connects.
      # Indexes and triggers are applied by the migrate service after prisma migrate deploy.
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. Redis — BullMQ queue + semantic cache ─────────────────────────────────

  redis:
    image: redis:7.4-alpine
    container_name: rag_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    # AOF persistence so queued jobs survive a container restart
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 3. Langfuse — AI observability (shares the Postgres instance) ─────────────
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: rag_langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

